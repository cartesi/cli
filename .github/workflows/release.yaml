name: Release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    packages: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            # Minimum required version for npm publish with OIDC Support
            # https://docs.npmjs.com/trusted-publishers
            # Pinned to a major: npm 12 changed `npm info --json` output, which broke `changeset publish` < 2.31.1
            - run: |
                  sudo npm install -g npm@12
                  npm --version

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
              with:
                  version: v1.4.3

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Test
              run: bun test

            - name: Coverage Report
              uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
              if: always()
              with:
                  lcov-path: coverage/lcov.info

            - name: Create Release Pull Request or Publish to npm
              id: changeset
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  commit: "release: version packages"
                  publish: bun run publish-packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    artifacts:
        name: Check release artifacts
        needs: release
        # Also run when `release` failed: publish can fail after tags were pushed,
        # and the tags plus registry state are what decide here.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        outputs:
            sdk_tag: ${{ steps.sdk.outputs.tag }}
            cli_tag: ${{ steps.cli.outputs.tag }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Find missing SDK images
              id: sdk
              run: |
                  VERSION=$(jq -r .version packages/sdk/package.json)
                  TAG="@cartesi/sdk@${VERSION}"
                  # Only a tagged version has been released
                  if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
                      echo "${TAG} is not tagged, nothing to publish"
                      exit 0
                  fi
                  for image in sdk rollups-runtime rollups-database; do
                      for registry in docker.io ghcr.io; do
                          if ! docker buildx imagetools inspect "${registry}/cartesi/${image}:${VERSION}" > /dev/null 2>&1; then
                              echo "Missing ${registry}/cartesi/${image}:${VERSION}"
                              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                              exit 0
                          fi
                      done
                  done
                  echo "All images for ${TAG} are published"

            - name: Find missing CLI binaries
              id: cli
              run: |
                  VERSION=$(jq -r .version apps/cli/package.json)
                  TAG="@cartesi/cli@${VERSION}"
                  # Count only the CLI tarballs, so another uploaded file can't hide a missing binary
                  if ! ASSETS=$(gh release view "${TAG}" --json assets --jq '[.assets[] | select(.name | startswith("cartesi-") and endswith(".tar.gz"))] | length' 2>/dev/null); then
                      echo "::warning::No GitHub release for ${TAG}, skipping CLI binaries"
                      exit 0
                  fi
                  # One tarball per compile target in apps/cli/build.ts
                  if [ "${ASSETS}" -lt 4 ]; then
                      echo "${TAG} has ${ASSETS}/4 binaries"
                      echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}

    build_sdk:
        name: Build SDK
        needs: artifacts
        if: ${{ needs.artifacts.outputs.sdk_tag != '' }}
        uses: ./.github/workflows/sdk.yaml
        with:
            ref: refs/tags/${{ needs.artifacts.outputs.sdk_tag }}
        secrets: inherit

    cli_binaries:
        name: CLI binaries
        needs: artifacts
        if: ${{ needs.artifacts.outputs.cli_tag != '' }}
        uses: ./.github/workflows/cli-binaries.yaml
        with:
            tag: ${{ needs.artifacts.outputs.cli_tag }}
