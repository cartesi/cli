name: Release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    packages: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changeset.outputs.published }}
            publishedPackages: ${{ steps.changeset.outputs.published-packages }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # Changesets v3 requires Node ^22.11 || ^24 || >=26
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            # Minimum required version for npm publish with OIDC Support
            # https://docs.npmjs.com/trusted-publishers
            # Pinned to a major: npm 12 changed `npm info --json` output, which broke `changeset publish` < 2.31.1
            - run: |
                  sudo npm install -g npm@12
                  npm --version

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
              with:
                  version: v1.4.3

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Test
              run: bun test

            - name: Coverage Report
              uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
              if: always()
              with:
                  lcov-path: coverage/lcov.info

            - name: Create Release Pull Request or Publish to npm
              id: changeset
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  commit-message: "release: version packages"
                  publish-script: bun run publish-packages

            - name: Release CLI binaries
              if: ${{ steps.changeset.outputs.published == 'true' && contains(fromJSON(steps.changeset.outputs.published-packages).*.name, '@cartesi/cli') }}
              run: |
                  for f in cartesi-*; do tar -czf "$f.tar.gz" "$f"; done
                  VERSION=$(jq -r '.[] | select(.name=="@cartesi/cli") | .version' <<< '${{ steps.changeset.outputs.published-packages }}')
                  TAG="@cartesi/cli@${VERSION}"
                  gh release upload "$TAG" cartesi-*.tar.gz
              working-directory: ./apps/cli/bin
              env:
                  GH_TOKEN: ${{ github.token }}

    build_sdk:
        name: Build SDK
        needs: release
        if: ${{ needs.release.outputs.published == 'true' && contains(fromJSON(needs.release.outputs.publishedPackages).*.name, '@cartesi/sdk') }}
        uses: ./.github/workflows/sdk.yaml
        secrets: inherit
