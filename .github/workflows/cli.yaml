name: cli
on:
    pull_request:
        paths:
            - ".github/workflows/cli.yaml"
            - "apps/cli/**"
            # TEMPORARY: the CLI is tested against the SDK built for the pull request
            - ".github/workflows/sdk.yaml"
            - "packages/sdk/**"
            - "packages/tsconfig/**"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true
permissions:
    contents: read
    packages: write
    pull-requests: write
jobs:
    # TEMPORARY: build and push ghcr.io/cartesi/{sdk,rollups-runtime,rollups-database}:pr-<number>
    # with the unreleased rollups-node fetched by packages/sdk/temp/fetch.sh
    sdk:
        uses: ./.github/workflows/sdk.yaml
        secrets: inherit
        permissions:
            contents: read
            packages: write
            id-token: write
            actions: write

    build:
        runs-on: ubuntu-latest
        # TEMPORARY: the tests run against the images of the sdk job
        needs: sdk
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
            # TEMPORARY: run the integration tests against the SDK built for the pull request
            CARTESI_TEST_SDK: cartesi/sdk:pr-${{ github.event.number }}
            CARTESI_TEST_RUNTIME_VERSION: pr-${{ github.event.number }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build --filter @cartesi/cli

            - name: Type check
              run: bun run --cwd apps/cli typecheck:tsc

            # TEMPORARY: the sdk job pushes the images to ghcr only, while compose refers to them
            # as cartesi/<image>:<tag>, which Docker looks up on Docker Hub
            - name: Use the SDK images of the pull request
              env:
                  TAG: pr-${{ github.event.number }}
              run: |
                  for image in sdk rollups-runtime rollups-database; do
                      docker pull "ghcr.io/cartesi/${image}:${TAG}"
                      docker tag "ghcr.io/cartesi/${image}:${TAG}" "cartesi/${image}:${TAG}"
                  done

            - name: Test
              run: bun test apps/cli/

            - name: Coverage Report
              uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
              if: always()
              with:
                  lcov-path: coverage/lcov.info
