http:
    routers:
        bundler:
            rule: "PathPrefix(`/bundler`)"
            middlewares:
                - "cors"
                - "remove-bundler-prefix"
            service: bundler
    middlewares:
        cors:
            headers:
                accessControlAllowMethods:
                    - GET
                    - OPTIONS
                    - PUT
                accessControlAllowHeaders: "*"
                accessControlAllowOriginList:
                    - "*"
                accessControlMaxAge: 100
                addVaryHeader: true
        remove-bundler-prefix:
            replacePathRegex:
                regex: "^/bundler/(.*)"
                replacement: "/$1"
    services:
        bundler:
            loadBalancer:
                servers:
                    - url: "http://bundler:4337"
