http:
    routers:
        passkey-server:
            rule: "PathPrefix(`/passkey`)"
            middlewares:
                - "remove-passkey-server-prefix"
            service: passkey-server
    middlewares:
        remove-passkey-server-prefix:
            replacePathRegex:
                regex: "^/passkey/(.*)"
                replacement: "/$1"
    services:
        passkey-server:
            loadBalancer:
                servers:
                    - url: "http://passkey-server:3000"
