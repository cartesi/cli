http:
    routers:
        inspect_server:
            rule: "PathPrefix(`/inspect`)"
            service: inspect_server
        rpc_server:
            rule: "PathPrefix(`/rpc`)"
            service: rpc_server
    services:
        inspect_server:
            loadBalancer:
                servers:
                    - url: "http://rollups-node:10012"
        rpc_server:
            loadBalancer:
                servers:
                    - url: "http://rollups-node:10011"
