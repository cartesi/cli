http:
    routers:
        paymaster:
            rule: "PathPrefix(`/paymaster`)"
            middlewares:
                - "remove-paymaster-prefix"
            service: paymaster
    middlewares:
        remove-paymaster-prefix:
            replacePathRegex:
                regex: "^/paymaster/(.*)"
                replacement: "/$1"
    services:
        paymaster:
            loadBalancer:
                servers:
                    - url: "http://mock-verifying-paymaster:3000"
