http:
    routers:
        espresso-reader:
            rule: "PathPrefix(`/transaction`)"
            middlewares:
                - "remove-espresso-reader-prefix"
            service: espresso-reader
    middlewares:
        remove-espresso-reader-prefix:
            replacePathRegex:
                regex: "^/transaction/(.*)"
                replacement: "/$1"
    services:
        espresso-reader:
            loadBalancer:
                servers:
                    - url: "http://espresso_reader:8081"
