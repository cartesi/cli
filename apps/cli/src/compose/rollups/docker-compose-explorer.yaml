x-explorer_db_env: &explorer_db_env
    DB_NAME: explorer
    DB_PORT: 5432
    DB_HOST: database
    DB_PASS: password

services:
    explorer_api:
        image: ghcr.io/cartesi/rollups-explorer-api:pr-52
        environment:
            <<: *explorer_db_env
            GQL_PORT: 4350
        expose:
            - 4350
        command: ["sqd", "serve:prod"]
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-fsS",
                    "http://127.0.0.1:4350/graphql?query=%7B__typename%7D",
                ]
            start_period: 10s
            start_interval: 200ms
            interval: 10s
            timeout: 1s
            retries: 5
        depends_on:
            database:
                condition: service_healthy

    squid_processor:
        image: ghcr.io/cartesi/rollups-explorer-api:pr-52
        environment:
            <<: *explorer_db_env
            CHAIN_IDS: ${CARTESI_BLOCKCHAIN_ID:-13370}
            RPC_URL_13370: ${RPC_URL:-http://anvil:8545}
            BLOCK_CONFIRMATIONS_13370: 0
            GENESIS_BLOCK_13370: 1
        command: ["sqd", "process:prod"]
        depends_on:
            database:
                condition: service_healthy

    explorer:
        image: ghcr.io/cartesi/rollups-explorer:pr-269
        expose:
            - 3000
        depends_on:
            database:
                condition: service_healthy

    proxy:
        volumes:
            - ./proxy/explorer.yaml:/etc/traefik/conf.d/explorer.yaml
            - ./proxy/explorer-api.yaml:/etc/traefik/conf.d/explorer-api.yaml
