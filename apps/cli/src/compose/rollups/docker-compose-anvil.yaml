services:
    anvil:
        image: cartesi/sdk:devel
        command:
            [
                "devnet",
                "--block-time",
                "${BLOCK_TIME:-5}",
                "${ANVIL_VERBOSITY:---silent}",
            ]
        healthcheck:
            test: ["CMD", "eth_isready"]
            interval: 200ms
            timeout: 500ms
            retries: 20
        environment:
            ANVIL_IP_ADDR: 0.0.0.0
        ports:
            - 8545:8545
