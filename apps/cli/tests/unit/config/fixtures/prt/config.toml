# example of an application deployed with PRT nodes by `cartesi run --prt`.
# without --prt the section is ignored.

[prt]
# optional, may rotate sentries on the consensus. default is none
# sentry_manager = "0x3333333333333333333333333333333333333333"

# one table per PRT node, keyed by its label, which names the container
# prt-node-<label>. every entry is a validator; sentry = true also appoints it
# on the consensus, in file order, with IDs from 1. an entry with a type is run
# by the CLI; one with only an address is appointed and run elsewhere
# type = "crisium" runs the Lua PRT player of the machine-emulator recipes
# instead of a sling node, as a sentinel that signs nothing or a validator

# the rollups-node's own entry, implied when omitted. claim = false runs it in
# reader mode, following the tournaments while the sling nodes claim
# [prt.nodes.reference]
# type = "reference"
# claim = false

[prt.nodes.first]
type = "sling" # no address: devnet account 20, the first of the CLI's PRT pool
sentry = true

[prt.nodes.second]
type = "sling" # devnet account 21
sentry = true

# a key of your own: the address is the key's, and you fund it
# [prt.nodes.mine]
# type = "sling"
# sentry = true
# private_key_file = "secrets/sentry.key"

[prt.nodes.theirs]
sentry = true
address = "0x5555555555555555555555555555555555555555" # appointed only

# a crisium sentinel: no account. it computes the honest claims and reports
# what a validator should have done and has not
# [prt.nodes.watch]
# type = "crisium"
# mode = "sentinel" # the default
# anomaly_handler = "prt/alerts.lua" # a Lua module the player calls with each anomaly, instead of printing it

# a crisium validator: a pool account, a devnet address or a key of your own,
# playing the honest player or the vandal, a scripted adversary that posts a
# made-up claim for epoch 0, loses the dispute and then idles
# [prt.nodes.red]
# type = "crisium"
# mode = "validator"
# kind = "honest" # the default
# private_key_file = "secrets/red.key"
