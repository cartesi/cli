# example of an application deployed with PRT sentries by `cartesi run --prt`.
# without --prt the section is ignored.

[prt]
# optional, may rotate sentries on the consensus. default is none
# sentry_manager = "0x3333333333333333333333333333333333333333"

# one table per PRT node, keyed by its label, which names the container
# prt-node-<label>. sentries are appointed on the consensus in file order,
# with IDs from 1. an entry with a type is run by the CLI; one with only an
# address is appointed and run elsewhere

[prt.nodes.first]
type = "sling"
role = "sentry" # no address: devnet account 20, the first of the CLI's PRT pool

[prt.nodes.second]
type = "sling"
role = "sentry" # devnet account 21

# a key of your own: the address is the key's, and you fund it
# [prt.nodes.mine]
# type = "sling"
# role = "sentry"
# private_key_file = "secrets/sentry.key"

[prt.nodes.theirs]
role = "sentry"
address = "0x5555555555555555555555555555555555555555" # appointed only
