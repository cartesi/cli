# example of an application with emergency withdrawal enabled.
# marking a raw drive or an nvram as the accounts drive is all it takes,
# the rest of the configuration is derived from the built machine.

[nvrams.accounts]
size = "4Mi"
accounts_drive = true

# optional overrides, defaults are devnet values
# [withdrawal]
# guardian = "0x1111111111111111111111111111111111111111"
# log2_leaves_per_account = 1
# withdrawal_output_builder = "0x2222222222222222222222222222222222222222"
