# example of an application with emergency withdrawal enabled.
# marking a raw drive or an nvram as the accounts drive turns it on, and its
# layout is derived from the built machine.

[nvrams.accounts]
size = "4Mi" # must be a power of two, unless accounts_drive_size is given
accounts_drive = true

# optional. every key is optional too
# [withdrawal.config]

# default to devnet values, required on a fork
# guardian = "0x1111111111111111111111111111111111111111"
# withdrawal_output_builder = "0x2222222222222222222222222222222222222222"

# size of each account in bytes, a power of two of at least 32. defaults to 32,
# which is what the devnet withdrawal output builder expects
# account_size = 32

# derived from the built machine, and checked against it when given
# log2_max_num_of_accounts = 17
# accounts_drive_start_index = 0x221
